name: xray

# PR report from pearpages/xray: dependencies, interactions, impact and risk, public API and
# bundle size, as one comment that updates on every push. Trial: see the PR that adds it.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # xray diffs against the merge base
          persist-credentials: false # the bundle analysis runs install and build scripts

      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile

      # Line coverage for xray's impact and risk section. The CI workflow is where tests gate
      # the PR, so here a failure must not stop the report: Vitest writes the report even when
      # tests fail (reportOnFailure), and instrumented tests get more time than the usual 15 s.
      # Vitest is called directly: `pnpm test -- …` passes a literal `--`, after which Vitest
      # ignores the flags.
      - run: >-
          pnpm exec vitest run --coverage --coverage.reporter=lcov
          --coverage.reportOnFailure --testTimeout=60000
        continue-on-error: true

      - uses: pearpages/xray@v0
        with:
          bundle: "true"
