name: CI

# Merging checks; releasing deploys (ADR 0020). A push to `main` runs `check`
# and nothing else, because docs and tests merge there too and none of them is a
# reason to republish the game. Publishing a GitHub release, which creates its
# `v*` tag, checks that commit again and deploys it.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  # A redeploy of a release, run from its tag ("Use workflow from: v0.6.0") —
  # after a Pages outage, say. Run from a branch it only checks.
  workflow_dispatch:

# Read-only unless a job says otherwise. The repository default is already
# read-only, but a default can be changed in Settings without touching this file;
# stated here, the token `check` runs PR code with cannot write to anything.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads mise.toml, so Node and pnpm versions have exactly one source of
      # truth and CI cannot silently drift from local.
      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile

      # ADR 0001 makes ESLint the readable half of boundary enforcement, and notes
      # it only counts if it runs here rather than only on someone's laptop.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm format:check

      # CI had never built the app, so a change that broke `vite build` passed
      # every check and would have surfaced at deploy time, after merge. Bundling
      # takes about a tenth of a second — the install above is the expensive part
      # and is already paid for — so this is effectively free on every PR.
      - run: pnpm build

      # The screen stories' config and every story compile (ADR 0017). Each story
      # is also rendered by the test step above; this catches what only a real
      # Storybook build would.
      - run: pnpm --filter @fm/app build-storybook

  # ── The live site ───────────────────────────────────────────────────────────
  #
  # https://futbol.pearpages.com, deployed from a release tag only, and only once
  # `check` is green on that commit: the whole point of gating is that nothing
  # which fails the suite can reach a public address. The `github-pages`
  # environment must allow `v*` tags as well as `main`, or the deploy is refused.
  #
  # Pages is configured with `build_type: workflow`, so this job *is* the
  # publication — there is no gh-pages branch and nothing is committed. The custom
  # domain means the site serves from a root, which is why `vite.config.ts` needs
  # no `base` and the app's root-absolute asset paths are correct as they stand.
  deploy:
    needs: check
    # A release, or a manual run from a release's tag. Never a branch: `check`
    # runs on `main` and on pull requests too, and neither publishes.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    # Job-level permissions *replace* the workflow-level ones rather than adding
    # to them, so all three have to be named here, `contents: read` included, or
    # the checkout fails.
    permissions:
      contents: read
      pages: write
      id-token: write

    # One deploy at a time, and never cancel one in flight: a half-published site
    # is worse than a slightly stale one.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The same action `check` uses. `docs/stack.md` is the only place a version
      # is decided and `mise.toml` is the single runtime source; reaching for
      # `setup-node` here would quietly make this file a second one.
      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile

      # The footer shows the release's tag (`commit.ts`), so a player can say
      # which version they are on. `ref_name` is the tag for both triggers.
      - run: pnpm build
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

      # Deliberately no `actions/configure-pages`: it writes to the Pages API, and
      # this repository's settings — custom domain, approved certificate — are
      # already right and not worth poking. `deploy-pages` needs it only when
      # Pages is not yet on the workflow build type. If a run ever fails saying
      # Pages is not enabled, that is the one reason to add it.
      - id: deploy
        uses: actions/deploy-pages@v4
