<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FormStrip · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { FormStrip, Screen } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          null,
          h(FormStrip, {
            label: 'Últims resultats',
            pips: [null, null, 'win', 'draw', 'loss', 'win'].map((outcome, i) => ({
              key: String(i),
              outcome,
              text: outcome ?? 'Sense jugar',
              mark: outcome === null ? undefined : { win: 'G', draw: 'E', loss: 'P' }[outcome],
            })),
          }),
        ),
      )
    </script>
  </body>
</html>
