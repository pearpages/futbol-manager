<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataTable · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { DataTable, Screen } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          null,
          h(
            DataTable,
            null,
            h(
              'thead',
              { className: 'data-table__head' },
              h(
                'tr',
                null,
                h('th', { className: 'is-text' }, 'Club'),
                h('th', null, 'PJ'),
                h('th', null, 'Punts'),
              ),
            ),
            h(
              'tbody',
              null,
              h(
                'tr',
                { className: 'data-table__row' },
                h('td', { className: 'is-text' }, 'Sevilla'),
                h('td', { className: 'data-table__num' }, '3'),
                h('td', { className: 'data-table__num' }, '7'),
              ),
              h(
                'tr',
                { className: 'data-table__row is-you' },
                h('td', { className: 'is-text' }, 'Madrid'),
                h('td', { className: 'data-table__num' }, '3'),
                h('td', { className: 'data-table__num' }, '6'),
              ),
            ),
          ),
        ),
      )
    </script>
  </body>
</html>
