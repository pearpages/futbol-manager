<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { Button, Modal, Screen, ScreenActions } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Modal,
          { title: 'Surt de la carrera', onClose: () => {} },
          h('p', null, 'La partida es desarà abans de sortir.'),
          h(
            ScreenActions,
            null,
            h(Button, { type: 'button' }, 'Cancel·la'),
            h(Button, { type: 'button', primary: true }, 'Surt'),
          ),
        ),
      )
    </script>
  </body>
</html>
