<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pager · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { Pager, Screen } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          null,
          h(
            Pager,
            {
              onPrev() {},
              onNext() {},
              prevLabel: 'Jornada anterior',
              nextLabel: 'Jornada següent',
              atStart: false,
              atEnd: false,
            },
            h('span', { className: 'pager__label' }, 'Jornada 3'),
          ),
        ),
      )
    </script>
  </body>
</html>
