<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { Button, Panel } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Panel,
          { as: 'header', className: 'preview-row' },
          h(Button, { type: 'button' }, 'Desada ràpida'),
          h(Button, { type: 'button' }, 'Partides'),
          h(Button, { type: 'button', primary: true }, 'Avança un dia'),
        ),
      )
    </script>
  </body>
</html>
