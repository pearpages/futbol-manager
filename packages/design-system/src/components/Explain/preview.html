<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explain · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { Explain, Screen, ScreenHeading } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          null,
          h(
            ScreenHeading,
            null,
            'Plantilla ',
            h(Explain, {
              label: 'Explica: com llegir aquesta taula',
              title: 'Com llegir aquesta taula',
              paragraphs: [
                'Un sol número que resumeix vuit atributs.',
                'El sou és el que costa tota una temporada.',
              ],
              closeLabel: 'Tanca',
            }),
          ),
        ),
      )
    </script>
  </body>
</html>
