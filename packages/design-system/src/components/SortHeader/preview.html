<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SortHeader · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { DataTable, Screen, SortHeader } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          null,
          h(
            DataTable,
            null,
            h(
              'thead',
              { className: 'data-table__head' },
              h(
                'tr',
                null,
                h(SortHeader, {
                  column: 'name',
                  label: 'Jugador',
                  sort: { key: 'name', desc: false },
                  onSort() {},
                  align: 'is-text',
                }),
                h(SortHeader, {
                  column: 'age',
                  label: 'Edat',
                  sort: { key: 'name', desc: false },
                  onSort() {},
                }),
              ),
            ),
          ),
        ),
      )
    </script>
  </body>
</html>
