<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Segments · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { Panel, Segments } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Panel,
          { className: 'preview-row' },
          h(Segments, {
            label: 'Lliga',
            options: [
              { value: 'table', label: 'Classificació' },
              { value: 'results', label: 'Resultats' },
              { value: 'calendar', label: 'Calendari' },
            ],
            value: 'table',
            onChange() {},
          }),
        ),
      )
    </script>
  </body>
</html>
