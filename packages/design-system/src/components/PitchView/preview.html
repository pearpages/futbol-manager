<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PitchView · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { PitchView, Screen } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          null,
          h(PitchView, {
            title: 'Alineació',
            selected: '9',
            onPick() {},
            starters: ['GK', 'DF', 'DF', 'DF', 'DF', 'MF', 'MF', 'MF', 'MF', 'FW', 'FW'].map(
              (position, i) => ({
                id: String(i),
                position,
                name: 'Jugador ' + (i + 1),
                rating: 70 + i,
                label: 'Jugador ' + (i + 1),
              }),
            ),
          }),
        ),
      )
    </script>
  </body>
</html>
