<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hint · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { Field, FieldLabel, Hint, Screen, Select } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          null,
          h(
            Field,
            null,
            h(FieldLabel, { htmlFor: 'f' }, 'Formació'),
            h(Select, { id: 'f' }, h('option', null, '4-4-2')),
          ),
          h(Hint, null, 'Tria una formació i l’onze s’ordena sol.'),
        ),
      )
    </script>
  </body>
</html>
