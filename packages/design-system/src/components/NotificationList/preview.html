<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NotificationList · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { NotificationList, Screen } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          null,
          h(NotificationList, {
            empty: 'Encara no ha passat res.',
            notices: [
              { key: '1', tone: 'good', text: 'Has guanyat el Sevilla per 2 a 1.' },
              { key: '2', tone: 'bad', text: 'El Getafe ha rebutjat la teva oferta.' },
              { key: '3', tone: 'plain', text: 'El mercat tanca d’aquí a 7 dies.' },
            ],
          }),
        ),
      )
    </script>
  </body>
</html>
