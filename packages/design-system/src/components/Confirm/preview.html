    <script src="../../../dist/bundle.js"></script>

      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS

      const h = React.createElement

          Confirm,
          {
            title: 'Fitxar Denzel Domfries?',
            confirmLabel: 'Fitxa',

            onConfirm() {},

          h('p', null, 'Traspàs 3,1 M€ i prima 0,3 M€. Et quedaran 18,6 M€.'),
        ),

    </script>
