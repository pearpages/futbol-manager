<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrophyIcon · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { Screen, TrophyIcon } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          { className: 'preview-row' },
          h(TrophyIcon, { trophy: 'league', src: '../../../assets/Images/league.webp' }),
          h(TrophyIcon, {
            trophy: 'league',
            src: '../../../assets/Images/league.webp',
            empty: true,
          }),
        ),
      )
    </script>
  </body>
</html>
