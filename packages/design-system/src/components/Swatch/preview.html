<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swatch · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { Screen, Swatch } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          { className: 'preview-row' },
          h(Swatch, { className: 'is-champion' }),
          ' Campió',
          h(Swatch, { className: 'is-ucl' }),
          ' Champions',
          h(Swatch, { className: 'is-relegation' }),
          ' Descens',
        ),
      )
    </script>
  </body>
</html>
