<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AttributeRadar · Futbol Manager design system</title>
    <link rel="stylesheet" href="../../../dist/bundle.css" />
    <link rel="stylesheet" href="../../preview.css" />
  </head>
  <body>
    <main id="root" class="preview"></main>
    <script src="../../../dist/bundle.js"></script>
    <script>
      const DS = window.FutbolDesignSystem
      const { React, createRoot } = DS
      const { AttributeRadar, Screen } = DS
      const h = React.createElement
      createRoot(document.getElementById('root')).render(
        h(
          Screen,
          null,
          h(AttributeRadar, {
            values: [76, 79, 80, 79, 78, 80, 87, 76],
            compare: [60, 85, 70, 72, 55, 65, 20, 80],
            labels: ['VEL', 'DEF', 'PAS', 'REG', 'ENT', 'AER', 'POR', 'RES'],
            title: 'Atributs',
          }),
        ),
      )
    </script>
  </body>
</html>
